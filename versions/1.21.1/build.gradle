// Day Counter — NeoForge 1.21.1 build.
// Modelled on the official NeoForge MDK for 1.21.1 (ModDevGradle, Java 21).

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "day-counter-neoforge"
}

// Mojang ships Java 21 to end users in 1.21.1, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/*.toml') { expand version: project.version }
}
